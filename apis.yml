aid: rimac-automobili
name: Rimac Automobili
description: >-
  Rimac Automobili d.o.o. is a Croatian electric hypercar manufacturer and automotive
  technology company founded by Mate Rimac in 2009 and headquartered at the Rimac Campus
  in Kerestinec, near Zagreb. It designs and builds the Nevera and Nevera R all-electric
  hypercars, and develops the vehicle software, infotainment, connectivity and telemetry
  stack that runs them in-house. Since the 2021 formation of the Bugatti Rimac joint
  venture with Porsche, the group's component and OEM-supply business was carved out into
  the sister company Rimac Technology, while Rimac Automobili remains the vehicle brand.
  Rimac operates a private, customer-only connected-vehicle backend — an MQTT-based
  telemetry platform feeding first-party iOS and Android owner apps with location,
  charging, battery and driving-performance data, plus over-the-air update and remote
  command channels — but it publishes no public developer program, developer portal,
  API reference, or machine-readable API contract of any kind. This profile is maintained
  in the API Evangelist network for company and portfolio tracking.
